version: 1
telemetry:
  protocol: http/json
  endpoint: http://localhost:4318/v1/traces
  insecure: true
privacy:
  mask_prompts: true
  mask_secrets: true
agents:
  cursor:
    # command: /usr/local/bin/cursor-agent  # default: cursor-agent on PATH
    cost:
      input_per_million: 3.0
      output_per_million: 15.0
