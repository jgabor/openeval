header:
  level: light
  created: "2026-06-14"
  status: active
  title: opencode runtime driver
what: |
  Add an `opencode` driver to the existing `agent.Driver` registry so engineers
  can run OpenEval scenarios against the opencode CLI via `--agent opencode`.
  The new driver mirrors the cursor driver: it resolves the opencode binary
  (config override, then PATH lookup), invokes it as a subprocess against the
  per-round workspace, parses the response for a trace identifier and token
  usage, and returns a cost estimate derived from configured rates.
why: |
  README.md and the previous plan both advertise opencode as a supported agent
  while deferring the driver implementation. The `agent.Driver` interface is
  already pluggable via the `agent.New(name, cfg)` switch, so adding a new
  runtime is small in cost and unblocks engineers who standardize on opencode
  without requiring a separate fork. It also advances the vision principle of
  platform-agnostic measurement by adding one more comparable runtime to the
  eval grid.
constraints: |
  - Mock and cursor drivers must remain unchanged and pass their existing tests.
  - Privacy-by-default is preserved: the driver itself sends no telemetry.
  - No vision or objective changes.
  - Tests must not require a live opencode install on CI.
  - Out of scope: opencode-specific OTEL/hook wiring, per-skill plugin loading,
    and any other additional runtime (Pi, etc.) remain deferred.
overall_acceptance: |
  GIVEN an authenticated opencode CLI WHEN an engineer runs example-fixtures
  with --agent opencode THEN the agent edits fixtures and score.json reflects
  verifier outcomes from real work. GIVEN the mock and cursor drivers WHEN
  the full test suite runs THEN existing driver tests still pass unchanged.
tasks:
  - number: 1
    name: Config schema and factory wiring
    depends_on: []
    status: pending
    acceptance:
      - "GIVEN config with no agents.opencode block WHEN --agent opencode runs THEN driver uses opencode from PATH"
      - "GIVEN config with agents.opencode.command set WHEN --agent opencode runs THEN driver uses that binary path"
      - "GIVEN --agent opencode WHEN the opencode binary is missing THEN run fails with an actionable error that mentions the config hint"
      - "GIVEN an unknown --agent value WHEN the driver factory runs THEN the error message lists opencode as a supported value alongside cursor and mock"
  - number: 2
    name: opencode driver implementation
    depends_on: ["1"]
    status: pending
    acceptance:
      - "GIVEN a task prompt WHEN the driver runs THEN opencode is invoked with the task prompt and the per-round workspace"
      - "GIVEN variation env vars WHEN the driver runs THEN those vars are present in the opencode subprocess environment"
      - "GIVEN opencode exits zero with JSON usage WHEN the driver parses THEN cost reflects parsed usage not a hardcoded placeholder"
      - "GIVEN a successful opencode run WHEN the driver completes THEN the round returns a non-empty trace identifier for score.json"
  - number: 3
    name: Driver shell-stub tests
    depends_on: ["2"]
    status: pending
    acceptance:
      - "GIVEN a stub opencode script WHEN the driver tests run THEN subprocess args and env are asserted without network"
      - "GIVEN the stub returns invalid JSON WHEN the driver runs THEN the error message is actionable and the parse error is surfaced"
      - "GIVEN the stub exits non-zero WHEN the driver runs THEN stderr is captured into the error message"
  - number: 4
    name: README and CLI help updates
    depends_on: ["2", "3"]
    status: pending
    acceptance:
      - "GIVEN the README agents table WHEN updated THEN opencode is listed alongside cursor with the same prerequisite shape"
      - "GIVEN --agent --help WHEN shown THEN the help text mentions opencode as a valid value"
      - "GIVEN the config example block WHEN updated THEN it shows an opencode command override"
surprises: ""
