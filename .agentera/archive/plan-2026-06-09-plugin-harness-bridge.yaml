header:
  level: full
  created: 2026-06-09
  status: complete
  reviewed: 2026-06-09
  critic_issues: "3 found, 3 addressed, 0 dismissed"
  title: Plugin-harness synergy bridge
  previous_plan_archived: plan-2026-06-09-cursor-agent-driver.yaml
what: >-
  Connect drop-in Cursor instrumentation with the scenario harness under one
  openeval CLI control plane. Ship the Decision 6 bridge deferred from the
  cursor-driver plan — real hook install, harness-run trace correlation,
  skill-backed variation proof, and README dual-rhythm positioning.
why: >-
  Decision 6 chose a single binary with dual rhythm: continuous plugin
  observability plus periodic harness proof on the same comparison contract.
  The cursor-driver plan deferred OTLP hook wiring and per-skill plugin
  loading. Without this bridge, instrumentation and harness remain separate
  product stories in code even though vision and decisions align.
constraints: >-
  No vision.yaml edits. Privacy-by-default. Keep mock agent for tests. OTLP
  remains an external span store — do not embed a trace database. Fail clearly
  when hooks or cursor-agent are missing in production paths.
scope:
  included:
    - Cursor hooks.json install wired to openeval config OTLP endpoint
    - OPENEVAL run-context env propagation into harness cursor-agent runs
    - OTLP span attributes linking score.json trace_id to run context
    - example-fixtures skill variation with config skills.aliases proof
    - traces command prints configured OTLP endpoint and lookup hints
    - README repositioning per Decision 6
    - tests and docs for the bridge
  excluded:
    - openeval trends or OTLP query rollups
    - Pi and OpenCode instrumentation
    - DeepSWE, margin-eval, Docker packaging
  deferred:
    - longitudinal plugin analytics CLI
    - full cursor-otel-hook feature parity beyond harness correlation
design: >-
  openeval instrument merges Cursor hook entries that read the shared config
  file and export masked spans to the configured OTLP endpoint. Before each
  harness round, the runner injects OPENEVAL scenario, variation, task, round,
  and trace identifiers into the cursor-agent subprocess environment so hook
  spans can join harness evidence. The telemetry exporter emits W3C-compatible
  session spans with the same trace_id stored in score.json plus run-context
  attributes. An example-fixtures variation declares skills resolved through
  config skills.aliases, exercising SeedSkills and --plugin-dir. README leads
  with CLI hub and dual rhythm; telemetry inventory moves below harness proof.
tasks:
  - number: 1
    name: Cursor hook install contract
    depends_on: []
    status: complete
    acceptance:
      - GIVEN openeval config with telemetry endpoint WHEN instrument --agent cursor THEN Cursor hooks.json is updated without removing unrelated user hooks
      - GIVEN instrument completes WHEN hook fires in a Cursor session THEN spans reach the configured OTLP endpoint with privacy masks applied
      - GIVEN missing write permission to hooks path WHEN instrument THEN command fails with an actionable error
  - number: 2
    name: Harness run context propagation
    depends_on: [1]
    status: complete
    acceptance:
      - GIVEN a harness round WHEN cursor-agent starts THEN subprocess env includes openeval scenario_id, variation, task_id, round, and trace_id
      - GIVEN variation env vars in scenario YAML WHEN round runs THEN both variation env and openeval context env are present
      - GIVEN mock agent driver WHEN tests run THEN no openeval context env is required for mock path
  - number: 3
    name: OTLP trace correlation attributes
    depends_on: [2]
    status: complete
    acceptance:
      - GIVEN a completed harness round WHEN runner exports OTLP THEN span traceId matches score.json trace_id for that round
      - GIVEN exported span WHEN inspected THEN attributes include scenario_id, variation, task_id, and round
      - GIVEN telemetry endpoint unset WHEN run completes THEN harness still writes score.json without export failure
  - number: 4
    name: Skill variation vertical slice
    depends_on: []
    status: complete
    acceptance:
      - GIVEN example-fixtures scenario WHEN a skill-backed variation is defined THEN run seeds skills into workspace .agents/skills
      - GIVEN a plugin-shaped skill alias WHEN variation lists that skill THEN cursor-agent receives --plugin-dir for that skill root
      - GIVEN skill variation run WHEN score.json written THEN skills_active lists the variation skills
  - number: 5
    name: traces command and run metadata
    depends_on: [3]
    status: complete
    acceptance:
      - GIVEN a run directory WHEN openeval traces is invoked THEN output includes trace_id and configured OTLP endpoint from openeval config
      - GIVEN score.json round WHEN traces prints THEN task and round flags resolve the matching trace_id
      - GIVEN Jaeger or collector URL pattern WHEN documented THEN README shows how to open the trace for a harness round
  - number: 6
    name: README dual-rhythm positioning
    depends_on: [1, 3, 4]
    status: complete
    acceptance:
      - GIVEN README intro WHEN read THEN openeval CLI is described as control plane with harness proof plus continuous instrumentation
      - GIVEN supported telemetry section WHEN read THEN it is framed as observation explaining harness outcomes not a parallel product
      - GIVEN quick start WHEN followed THEN instrument and run example-fixtures remain the primary path
  - number: 7
    name: Tests, docs, and plan closeout
    depends_on: [1, 2, 3, 4, 5, 6]
    status: complete
    acceptance:
      - GIVEN stub hook script and cursor-agent WHEN integration tests run THEN hook install and env propagation are asserted without network
      - GIVEN skill variation fixture WHEN tests run THEN SeedSkills and plugin-dir wiring are covered
      - GIVEN all tasks complete WHEN plan closes THEN statuses updated and prior plan reference preserved in archive
overall_acceptance:
  - GIVEN instrumented Cursor and authenticated cursor-agent WHEN engineer runs example-fixtures with a skill variation THEN score.json, OTLP spans, and traces output share trace and run context for the same round
  - GIVEN README after this plan WHEN a new engineer reads it THEN plugin observability and harness proof read as one CLI product per Decision 6
surprises: []
