id: wkkyvqcpkt
artifact: plan
record:
  name: Make the shipped demo checkout-independent
  description: Keep the compare-first scenario, verifier assets, and demo skill available to the CLI outside a repository checkout without creating a second source of truth.
  depends_on:
    - lvtqhigufb
  status: pending
  acceptance:
    - GIVEN no OpenEval checkout exists in the working directory WHEN the shipped demo runs with the hermetic agent THEN both variation arms and comparison complete using the shipped scenario, verifier, fixtures, and demo skill.
    - GIVEN a user supplies an explicit scenario path, scenario alias, or skill alias WHEN it resolves successfully THEN that user-owned selection retains its current precedence over shipped assets.
    - GIVEN an explicit user-owned asset is invalid WHEN execution starts THEN OpenEval reports the invalid selection rather than silently substituting a shipped asset.
    - GIVEN shipped assets are used from checkout and installed contexts WHEN their behavior is compared THEN they derive from one canonical asset source and produce the same scenario and skill contract.
    - Verification includes at least one no-checkout success and one invalid explicit-asset failure for each changed resolution contract.
  plan: oviqkurhum
